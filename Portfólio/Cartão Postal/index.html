<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Postal de São Paulo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('imgs/Capa.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            background-color: #121212;
        }
        .cartao-postal {
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }


        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .subtitulo {
            font-size: 1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #e0e0e0;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 16px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f5f5f5;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="cartao-postal">
        <header>
            <h1>São Paulo</h1>
            <p class="subtitulo">A maior metrópole da América Latina</p>
        </header>
        <main>
            <p>Entre arranha-céus imponentes, a garoa fina e uma energia que nunca cessa, pulsa o coração cultural e financeiro que acolhe o mundo inteiro em uma única cidade.</p>
        </main>
    </div>

</body>
</html>
